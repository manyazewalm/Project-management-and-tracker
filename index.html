<!DOCTYPE html>
<html>
<head>
    <title>Project management and tracker</title>
    <style>
        /* Make iframe fill the whole screen */
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe src="https://script.google.com/macros/s/AKfycbzCaALK6Ny8R1cw5g6OO9IhV0Dxx8hGknuYoGOFA9uurKD2it4f2n-Sz3P8LhHetj3k/exec"
            allowfullscreen></iframe>

    <script>
                window.onload = function() {
                    const iframe = document.querySelector('iframe');
                    if (iframe) {
                        iframe.requestFullscreen().catch((err) => {
                            console.error(`Error attempting to enable full-screen mode: ${err.message}`);
                        });
                    } else {
                        console.error("Iframe not found in the document.");
                    }
                };
    </script>
</body>
</html>
