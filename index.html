<!DOCTYPE html>
<html>
<head>
<title>Project management and tracker</title>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycby2T8bIKeJqMP-UHyao3D-LVkh0h9lLrhDdSL5-RoySJoJGYfnPR86y3A2oHcllO3UJOA/exec"
width="100%"
height="100%"
allowfullscreen="true"
style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;"></iframe>

<script>
window.onload = function() {
  document.querySelector('iframe').requestFullscreen().catch((err) => {
    console.error(`Error attempting to enable full-screen mode: ${err.message}`);
  });
};
</script>
</body>
</html>
